[project]
name = "agentic-ai-assistant"
version = "1.0.0"
description = "Production-ready LangChain/Groq agentic assistant exposed through FastAPI."
requires-python = ">=3.12"
dependencies = [
    "arxiv>=2.1.3",
    "fastapi>=0.115.0",
    "google-api-python-client>=2.140.0",
    "httpx>=0.27.0",
    "langchain>=1.0.0",
    "langchain-community>=0.3.0",
    "langchain-groq>=0.3.0",
    "langgraph>=0.3.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.8",
    "python-dotenv>=1.0.1",
    "ruff>=0.6.0",
    "tenacity>=8.5.0",
    "uvicorn[standard]>=0.30.0",
    "wikipedia>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
